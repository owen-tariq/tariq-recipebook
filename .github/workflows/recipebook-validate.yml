name: Recipebook site validation
on:
  push:
    branches: [main, feature/hellofresh-library-78]
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax and data validation
        run: |
          node --check hf.js
          node --check api/recipe-photo.js
          node scripts/validate-recipes.js
